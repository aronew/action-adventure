# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: hazard_pit_depth_min
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/terrain-pipeline.md
    value: 84
    unit: px
    notes: "F7. Least height of both dash-pit lips above a hazard floor: hazard_pogo_reach (about 76) + gap_margin (8). Spikes can be pogoed (rule 24); a grapple gap never has a hazard floor."
    added: 2026-11-19
  - name: pogo_far_ext
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/terrain-pipeline.md
    value: 14
    unit: px
    notes: "F7. How far past a gap lip a pogo target is still hit from over the gap: down-attack forward reach 27 (attack_data.tres) - centre shortfall 18 at gap_min = 9 (11 for a grapple gap at 420), kept at 14 at both lips as a 5 px safety band (ninth review corrected the derivation; value unchanged). Measured to the target's hit-area edge."
    added: 2026-11-19
  - name: pogo_clearance_px
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/terrain-pipeline.md
    value: 250   # was 140 (start-kit run-speed carry); level-design.md ninth design review
    unit: px
    notes: "F7. F2, F6a and F6b column gates (fifteenth review added F6b, the climb wall), whose earlier kit owns the dash: a pogo refreshes the air dash, so pogo_carry_dash 211 (60 Hz sim) + hitbox_width 10 + down-attack back reach 21 = 242, rounded up. Was 120 before the eighth review (body width only), 140 before the ninth (run-speed carry)."
    added: 2026-11-19
    revised: 2026-11-19
  - name: pogo_clearance_f3a_px
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/terrain-pipeline.md
    value: 320
    unit: px
    notes: "F7. F3a grapple-ledge column gates (earlier kit: dash, wall cling, double jump): a pogo refreshes the air jump and air dash, pogo_carry_f3a 287 (60 Hz sim) + 10 + 21 = 318, rounded up."
    added: 2026-11-19
  - name: chase_leash
    status: active
    source: design/gdd/level-design.md
    referenced_by: []
    value: 48   # range 24-96, Rec; level-design.md tenth design review
    unit: px
    notes: "F7, rule 24. How far past its patrol range a chasing enemy may follow the Seeker; it walks back to its spawn point when it loses the Seeker (no re-homing where a chase stopped). Leash bound = spawn_x +/- (patrol_distance + chase_leash), grown by body half-width, a vertical strip for a ground enemy (fourteenth review: the hurt state has no floor-edge check, so a knockback off a ledge could land the enemy in a gate volume below; the placement check compares x-ranges at any height), a hard clamp on every source of horizontal motion (twelfth review: take_hit restarts the push on every hit, so pushes stack; thirteenth review: _state_attack lunges, skitter about 126 px with its slide-out): grunt 103, skitter 118, brute 59 px. Fifteenth review: a stranded enemy walks toward its spawn x, else patrols in place (the clamp anchors to the original spawn x), and an enemy knocked out of its room reappears at its spawn point. Not in code (enemy_base.gd chases to lose_range, re-homes where a chase stopped, sets unlimited knockback per hit and lunges unclamped). Registered here until the Enemies GDD exists; that GDD must adopt it."
    added: 2026-11-19
  - name: save_spacing_max
    status: deprecated
    source: design/gdd/level-design.md
    referenced_by: []
    value: 7
    unit: screens
    notes: "Withdrawn 2026-11-19 (level-design.md eleventh review, owner): saves are placed by role (near bosses and mini-bosses, hubs, rewards) and spacing is judged in playtest; no distance rule, F4 removed. Was: F4, new ground counted by screen position, 7 screens, range 7-10."
    added: 2026-11-19
  - name: collision_tile
    status: active
    source: design/gdd/terrain-pipeline.md
    referenced_by:
      - design/gdd/terrain-pipeline.md
    value: 6
    unit: px
    notes: "Rule 2. Side of a black collision tile, anchored at the room top-left; a 480 x 270 screen is 80 x 45 tiles. Must divide 30 and the art cell (36 px in the art-style test room); every collision, room and gate edge lies on the grid. Owner decision 2026-11-19 (Hollow Knight-style block-out)."
    added: 2026-11-19
  - name: trim_overhang_max
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/terrain-pipeline.md
    value: 4
    unit: px
    notes: "Level design rule 25 (range 2-6, Rec). How far painted trim or dressing may cover the collision edge at a gate or no_cling face, at game scale; measured by terrain pipeline T3 (alpha_solid 0.5). Registered 2026-11-19 by the terrain pipeline GDD."
    added: 2026-11-19
  - name: enemy_return_delay
    status: active
    source: design/gdd/rooms-and-transitions.md
    referenced_by:
      - design/gdd/rooms-and-transitions.md
      - design/gdd/level-design.md
    value: 2
    unit: s
    notes: "Rooms and transitions Edge Cases (range 0.5-5, Rec). An enemy knocked out of its room through an open bottom edge or a pit is removed at the room's bounds and reappears at its spawn point after this delay; level design Edge Cases asked for it. The Enemies GDD must adopt it."
    added: 2026-11-19

