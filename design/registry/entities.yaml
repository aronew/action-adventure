# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-19"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: dash_gap_window
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
      - design/gdd/terrain-pipeline.md
    variables:
      - run_jump_distance
      - dash_jump_distance
      - hitbox_width
      - ledge_nudge
      - gap_margin
      - pit_depth_min
    output_range: [145, 162]
    expression: "gap_min = run_jump_distance + hitbox_width + ledge_nudge + gap_margin; gap_max = dash_jump_distance + hitbox_width/2 - gap_margin"
    notes: "F1. px edge to edge at gap_margin 8; level lips, nothing in mid-gap; below: a kill plane, a hazard floor at least hazard_pit_depth_min (about 84, level design F7) below both lips (spikes can be pogoed), or a safe floor at least pit_depth_min (about 72) below the far lip (ability-gating.md second design review)."
    added: 2026-11-18
    revised: 2026-11-19
  - name: double_jump_ledge_window
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
      - design/gdd/terrain-pipeline.md
    variables:
      - jump_apex
      - double_jump_total_low
      - ledge_nudge
      - ledge_margin_low
      - ledge_margin_high
      - hitbox_height
      - cling_margin
    output_range: [72, 106]
    expression: "ledge_min = jump_apex + ledge_nudge + ledge_margin_low; ledge_max = double_jump_total_low - ledge_margin_high; head_clear = jump_apex + hitbox_height + cling_margin"
    notes: "F2. px ledge top at margins 7/7; head_clear about 88; plus the F8 launch-face test (keys 1-2). Was [72, 108]: ledge_max used 115, the sim figure is 113.5 (ability-gating.md design review)."
    added: 2026-11-18
    revised: 2026-11-18
  - name: grapple_gate
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
      - design/gdd/terrain-pipeline.md
    variables:
      - double_jump_total
      - ledge_nudge
      - grapple_margin
      - max_non_grapple_crossing
      - far_face_extra
      - landing_slack
      - grapple_range
    output_range: [126, 441]
    expression: "F3a: target_height >= double_jump_total + ledge_nudge + grapple_margin, anchor at or above the ledge top with the near edge within exit_reach_min(h_a, theta) + landing_slack - anchor_margin; F3b: gap_width >= max_non_grapple_crossing + far_face_extra + landing_slack + grapple_margin"
    notes: "F3. Ledge 126+ px (no_cling faces; was 121, third review added ledge_nudge) or 151+ (8 px plain slab); gap 420-434+ px (no_cling far face) or 427-441+ (plain far face up to 16 px), over a kill plane only, never a hazard (a pogo refreshes the air moves); chain of at least two gate anchors; F8 test with keys 1-3 (ability-gating.md second design review)."
    added: 2026-11-18
    revised: 2026-11-19
  - name: cling_wall
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
      - design/gdd/terrain-pipeline.md
    variables:
      - ledge_min
    output_range: [72, null]
    expression: "wall_height >= ledge_min, no standing spot on the face"
    notes: "F6a/F6b. px; a climb wall is climbable-marked."
    added: 2026-11-18
    revised: ""
  - name: bisque_pane_detect
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
      - design/gdd/terrain-pipeline.md
    variables:
      - dash_speed
      - sim_hz
      - detect_margin
    output_range: [9, 17]
    expression: "pane_detect_px = ceil(dash_speed / sim_hz) + detect_margin"
    notes: "F10. 9 px at dash_speed 370, detect_margin 2; pane 8-16 px thick, floor to ceiling, not hittable, breaks only in the dash state."
    added: 2026-11-18
    revised: ""
  - name: gate_anchor_chain
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
    variables:
      - grapple_range
      - release_reach
      - exit_reach_min
      - landing_slack
      - anchor_margin
      - chain_window
    output_range: [176, 221]
    expression: "grapple hops <= grapple_range; far_x(a_n) <= exit_reach_min(h_n, theta_n) + landing_slack - anchor_margin; far_x(a_(n-1)) > release_reach(h_(n-1)) + landing_slack + anchor_margin; anchors hooked in order; hooking a gate anchor spends the air jump and air dash; no plain anchor within grapple_range of the flight envelope, no climbable or hittable in it"
    notes: "F11. Output is the least far_x of the second-to-last anchor, px, for anchor heights h 50-200 above the far lip at anchor_margin 16. release_reach(h) estimated 145-190, exit_reach_min(h, theta) (plain release, no input; the intended last flight must land with no input) about 129-146 for a level hop, 14 at 60 deg: 60 Hz sim of the grapple and air states with the release ending after grapple_release_time (0.08 s, to add to player_config), unmeasured. Third review (ability-gating.md): the second review's 275-371 and 162-285 modelled the whole fall as the release and are withdrawn; example chain now 140/310 px over a 440 px chasm."
    added: 2026-11-18
    revised: 2026-11-19
  - name: wall_launch_reach
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
    variables:
      - kit
      - launch_rise
      - dh
      - wall_reach
    output_range: [231, 420]
    expression: "a plain face is a launch face for a gate target when it faces the target, face_top >= target_top - launch_rise(kit), and its horizontal distance to the target is <= wall_reach(kit, dh), dh = max(0, face_top - target_top)"
    notes: "F8. px, 60 Hz sim table: keys 1-2 about 231 (dh 0) to 317 (dh 300); keys 1-3 about 333 to 420. Unmeasured. A gate (F2, F3a, F3b) must have no launch face."
    added: 2026-11-18
    revised: ""
  - name: gate_room_footprint
    status: active
    source: design/gdd/ability-gating.md
    referenced_by:
      - design/gdd/ability-gating.md
      - design/gdd/level-design.md
    variables:
      - span
      - room_height
      - dh_wall
      - wall_reach
      - landing_slack
      - room_width
    output_range: [606, 852]
    expression: "room_width >= span + 2 * (wall_reach(kit, dh_wall) + landing_slack)"
    notes: "F9. Width needed beyond the span, px, for plain walls to the ceiling at 270 px room height: about 606 (F2 ledge), 758 (F3a ledge), 852 (F3b gap). Exempt where every plain face in reach is no_cling. Level design rule 26 reads it."
    added: 2026-11-18
    revised: ""
  - name: on_grid
    status: active
    source: design/gdd/terrain-pipeline.md
    referenced_by:
      - design/gdd/terrain-pipeline.md
    variables:
      - collision_tile
      - lo
      - hi
    output_range: [0, null]
    expression: "on_grid(lo, hi) = { k x collision_tile : ceil(lo / collision_tile) <= k <= floor(hi / collision_tile), k >= 0 }"
    notes: "T1. The gate figures the 6 px grid allows inside a window owned by ability gating or level design, with lo and hi computed from the owner's formula at the current player_config (never rounded figures): dash gap 150, 156 (gap_max 161.4 from the sim's dash_jump_distance 164.4; 162 enters only if a measured value reaches 165); F2 ledge 72-102 step 6; F3a slab underside 144+; F3b plain far face 0, 6 or 12; pane 12. An open-ended window takes hi = room size. An empty set fails the layout check as gate type unbuildable."
    added: 2026-11-19
    revised: 2026-11-19
  - name: band_on_grid
    status: deprecated
    source: design/gdd/terrain-pipeline.md
    referenced_by: []
    variables:
      - band
      - collision_tile
    output_range: [0, null]
    expression: "band_on_grid = collision_tile x ceil(band / collision_tile)"
    notes: "Withdrawn 2026-11-19 (terrain-pipeline.md first design review, owner): a distance between on-grid edges is whole tiles, so the raw band and the rounded band give the same answer, and for off-grid hit-area edges (pogo_far_ext) rounding would tighten a band level design owns. Level design's bands (250, 320, 14) are used as written."
    added: 2026-11-19
    revised: 2026-11-19
  - name: transition_time
    status: active
    source: design/gdd/rooms-and-transitions.md
    referenced_by:
      - design/gdd/rooms-and-transitions.md
    variables:
      - fade_out_time
      - load_left
      - fade_in_time
    output_range: [0.2, null]
    expression: "transition_time = fade_out_time + max(0, load_left) + fade_in_time"
    notes: "R3. s; 0.35 s for a preloaded neighbour at fade_out_time 0.15 and fade_in_time 0.2 (ranges 0.1-0.4 each); the world is paused only while dark; a loading mark shows after load_wait_notice 0.5 s of dark."
    added: 2026-11-19
    revised: ""
  - name: preload_deadline
    status: active
    source: design/gdd/rooms-and-transitions.md
    referenced_by:
      - design/gdd/rooms-and-transitions.md
    variables:
      - d_min
      - dash_speed
      - load_time
    output_range: [0, null]
    expression: "t_reach(exit) = d_min(exit) / dash_speed; exit listed when t_reach < load_time(target)"
    notes: "R5. Advisory room check, lists exits for level design, never refuses a room. dash_speed read from player_config.tres (370); biome first load 0.75-1.07 s measured in the container (level design Open Question 22)."
    added: 2026-11-19
    revised: ""

