  - name: channel_time
    status: active
    source: design/gdd/healing.md
    referenced_by: []
    value: 1.0
    unit: s
    notes: "Healing rules 7 and 8 (range 0.5-2.0 s; owner, 2026-11-22). The planted channel before a heal completes. Compared against the gap from the end of one boss strike to the start of the next: previous recovery plus attack_cooldown 0.6 s plus the next pattern's wind-up, and the last pattern is never picked again, so the gaps are 2.4 to 3.0 s (after slam 2.7 or 2.9, after lunge 2.6 or 3.0, after shockwave 2.4 or 3.0; 0.4 s more after a stagger: post_stagger_cooldown 1.0 s replaces attack_cooldown 0.6 s) and the 4.0 s stagger. A heal started right after a strike ends 0.6 to 0.9 s before the next wind-up begins, so the existing patterns cannot punish it; that is the boss's to change (Healing Open Question 12). A heal that follows a hit starts after the 0.35 s hurt lock and ends about 0.55 s (after a slam) or 0.25 s (after a lunge or shockwave) before the next wind-up, and at least 1.05 s before the next strike (fifth design review, 2026-11-23). A shockwave already in flight (3.5 s at 150 px/s) is the exception. Revised in the second design review (replaced the 1.0-1.3 s recovery premise) and the third (replaced the gap labels, which named same-pattern repeats that cannot happen). Bosses adds itself to referenced_by when its GDD adopts it; empty until then."
    added: 2026-11-22
