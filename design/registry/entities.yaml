# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: hazard_pit_depth_min
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/ability-gating.md
    value: 84
    unit: px
    notes: "F7. Least height of both dash-pit lips above a hazard floor: hazard_pogo_reach (about 76) + gap_margin (8). Spikes can be pogoed (rule 24); a grapple gap never has a hazard floor."
    added: 2026-11-19
  - name: pogo_far_ext
    status: active
    source: design/gdd/level-design.md
    referenced_by:
      - design/gdd/ability-gating.md
    value: 14
    unit: px
    notes: "F7. How far past a gap lip a pogo target is still hit from over the gap: down-attack forward reach 27 (attack_data.tres) - centre shortfall 18 at gap_min = 9 (11 for a grapple gap at 420), kept at 14 at both lips as a 5 px safety band (ninth review corrected the derivation; value unchanged). Measured to the target's hit-area edge."
    added: 2026-11-19
  - name: pogo_clearance_px
    status: active
    source: design/gdd/level-design.md
    referenced_by: []
    value: 250   # was 140 (start-kit run-speed carry); level-design.md ninth design review
    unit: px
    notes: "F7. F2 and F6a column gates, whose earlier kit owns the dash: a pogo refreshes the air dash, so pogo_carry_dash 211 (60 Hz sim) + hitbox_width 10 + down-attack back reach 21 = 242, rounded up. Was 120 before the eighth review (body width only), 140 before the ninth (run-speed carry)."
    added: 2026-11-19
    revised: 2026-11-19
  - name: pogo_clearance_f3a_px
    status: active
    source: design/gdd/level-design.md
    referenced_by: []
    value: 320
    unit: px
    notes: "F7. F3a grapple-ledge column gates (earlier kit: dash, wall cling, double jump): a pogo refreshes the air jump and air dash, pogo_carry_f3a 287 (60 Hz sim) + 10 + 21 = 318, rounded up."
    added: 2026-11-19
  - name: chase_leash
    status: active
    source: design/gdd/level-design.md
    referenced_by: []
    value: 48   # range 24-96, Rec; level-design.md tenth design review
    unit: px
    notes: "F7, rule 24. How far past its patrol range a chasing enemy may follow the Seeker; it walks back to its spawn point when it loses the Seeker (no re-homing where a chase stopped). Leash bound = spawn_x +/- (patrol_distance + chase_leash + knockback_travel), grown by body half-width: grunt 119, skitter 144, brute 63 px. Not in code (enemy_base.gd chases to lose_range). Registered here until the Enemies GDD exists; that GDD must adopt it."
    added: 2026-11-19
  - name: save_spacing_max
    status: active
    source: design/gdd/level-design.md
    referenced_by: []
    value: 7
    unit: screens
    notes: "F4. New ground only, counted by screen position; range 7-10; optional branches held to the same limit."
    added: 2026-11-19

